# Runs the test suite on every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_sqlite, intl
          coverage: none

      # Node 24 ships npm 11, like local development; npm 10 rejects the lockfile's optional peers.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Builds the CSS/JS and copies the simple-icons SVGs that the hero and skills use.
      - name: Install and build frontend
        # npm install, not npm ci: on Linux the optional @laravel/multiplex tree wants a react peer
        # that the lockfile (made on macOS) doesn't list. shortcut: sync the lockfile on Linux to go back to npm ci.
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test --compact

  # CD: only after tests pass on a push to master. Builds the image on GitHub (the home server is slow
  # and on a flaky hotspot), pushes it to GHCR, then tells the server to pull it over Tailscale.
  image:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/noviindraf/portfolio-web:latest
            ghcr.io/noviindraf/portfolio-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    concurrency: deploy-home-server
    permissions:
      packages: read
    steps:
      # Ephemeral tailnet node tagged tag:ci; the tailnet policy lets it reach only the server's SSH port.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The deploy key is locked on the server to deploy/server-deploy.sh (no shell).
      # stdin carries a short-lived GHCR token so the server can pull without stored credentials.
      - name: Deploy to home server
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "100.76.192.19 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOs13ZxvbcooszHARmyYbPxAR+rH3xdtHt4RxcptDM0y" > ~/.ssh/known_hosts
          printf '%s\n%s\n' "${{ github.actor }}" "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/deploy novi-indra-fanani@100.76.192.19

# Example Nginx site for the portfolio (Ubuntu + PHP 8.4-FPM).
# Copy to /etc/nginx/sites-available/portfolio, adjust server_name and paths, then:
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com   (free HTTPS)

server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/portfolio/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25M;   # admin uploads (images up to 8 MB, .glb up to 20 MB)

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Hashed Vite build files: cache for a year
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded images, icons, 3D models, CV
    location ~* ^/(storage|icons)/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

types {
    model/gltf-binary glb;
}
